[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[project]
name = "spanish-sentiment-lab"
version = "2.0.0"
description = "A testable Flask sentiment-analysis case study for quality engineering."
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-WTF>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "setuptools>=83,<84",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
